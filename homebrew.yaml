---
- name: Homebrew
  tags:
    - homebrew
  block:
    - name: Download script
      get_url: 
        url: https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh
        dest: /tmp/homebrew-install.sh
        owner: ben
        mode: 0755
  
    - name: Run Homebrew install script
      shell: export NONINTERACTIVE=1 && /tmp/homebrew-install.sh
      become: yes
      become_user: ben

- name: Homebrew install programs
  shell: /home/linuxbrew/.linuxbrew/bin/brew install fzf tmux kubernetes-cli
  args:
    executable: /bin/zsh
  become: yes
  become_user: ben
  tags:
    - brew

